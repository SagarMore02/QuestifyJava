<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Organizer Dashboard - Main Content</title>
    <link rel="stylesheet" href="/css/OrganizerDash.css">
</head>
<body>
    <div class="main-content">
        <div class="header">
            <h1>Dashboard</h1>
        </div>
        <div class="content">
            <div class="card">
                <h3>Total Students</h3>
                <p id="total-students">Loading...</p>
            </div>
            <div class="card">
                <h3>Students Applied For Your Exams</h3>
                <p id="students-applied">Loading...</p>
            </div>
            <div class="card">
                <h3>Upcoming Exams</h3>
                <p id="upcoming-exams">Loading...</p>
            </div>
            <div class="card">
                <h3>Pending Approvals</h3>
                <p id="pending-approvals">Loading...</p>
            </div>
        </div>
    </div>
    <script>
        // Function to fetch data from the API
        async function fetchData() {
                    const token = localStorage.getItem('token'); // assuming you stored it after login

            if (!token) {
                console.error("No token found in localStorage. Redirecting to login.");
                window.location.href = '/html/Login.html';
                return;
            }
            const response = await fetch('http://localhost:8080/v1/questify/organizer/dashboard', {
                method: 'GET',
                headers: {
                    'Authorization': `Bearer ${token}`,
                    'Content-Type': 'application/json'
                }
            });

            if (response.status === 401) {
                alert("Session expired. Please log in again.");
                localStorage.removeItem('token');
                window.location.href = '/html/Login.html';
                return;
            }

            const data = await response.json();
            document.getElementById('total-students').textContent = data.totalStudents || 'N/A';
            document.getElementById('students-applied').textContent = data.studentsApplied || 'N/A';
            document.getElementById('upcoming-exams').textContent = data.upcomingExams || 'N/A';
            document.getElementById('pending-approvals').textContent = data.pendingApprovals || 'N/A';

        }

        // Call fetchData when the page loads
        window.onload = fetchData;
    </script>
</body>
</html>
