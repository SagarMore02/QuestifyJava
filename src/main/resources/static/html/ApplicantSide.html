<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Dashboard</title>
    <link rel="stylesheet" href="/css/ApplicantNavbar.css">
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const token = localStorage.getItem('token'); // assuming you stored it after login

            if (!token) {
                console.error("No token found in localStorage. Redirecting to login.");
                window.location.href = '/html/Login.html';
                return;
            }
            fetch('http://localhost:8080/v1/questify/profile', {
                method: 'GET',
                headers: {
                    'Authorization': `Bearer ${token}`,
                    'Content-Type': 'application/json'
                }
            })
                .then(response => response.json())
                .then(data => {
                    if (data.username) {
                        document.getElementById('username').textContent = data.username;
                    } else {
                        console.error('Failed to fetch username');
                    }
                })
                .catch(error => console.error('Error fetching profile:', error));
            //end
            document.getElementById('Result').addEventListener('click', () => Screenchange('/html/ApplicantResults.html'));
            document.getElementById('UpcomingExam').addEventListener('click', () => Screenchange('/html/AppliedExam.html'));
            document.getElementById('ApplicantDash').addEventListener('click', () => Screenchange('/html/ApplicantDash.html'));
            document.getElementById('ApplicantInfo').addEventListener('click', () => Screenchange('/html/ApplicantInfo.html'));
            document.getElementById('ApplicantExam').addEventListener('click', () => Screenchange('/html/ApplyforExam.html'));
            document.getElementById('Logout').addEventListener('click', () => handleLogout());
        });

        function handleLogout() {
            fetch('/logout')
                .then(response => {
                    if (response.ok) {
                        // Reload the parent window to home.html
                     window.top.location.replace('/home.html');
                    } else {
                        console.error('Logout failed');
                    }
                  })
                .catch(error => console.error('Error:', error));
            }
        // Function to change the right frame's content
        function Screenchange(content) {
            // Alert to confirm function call (remove after debugging)
            //alert("Changing frame content to: " + content);
            // Change the right frame's source to the specified content
            parent.frames['right'].location.href = content;
        }
    </script>
</head>
<body>
    <nav class="navbar">
        <div class="profile-section">
            <h4>Hello <span id="username"></span></h4>
        </div>
        <ul class="navbar-links">
            <li><a href="#" id="ApplicantDash">Dashboard</a></li>
            <li><a href="#" id="ApplicantInfo">Profile</a></li>
            <li><a href="#" id="ApplicantExam">Apply For Exam</a></li>
            <!-- <li><a href="#" id="">Pay Fees</a></li> -->
            <li><a href="#" id="Result">Result</a></li>
            <li><a href="#" id="UpcomingExam">Upcoming Exam</a></li>
            <li><a href="#" id="Logout">Logout</a></li>
        </ul>
    </nav>
</body>
</html>
