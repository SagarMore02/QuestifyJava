<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Applicant Dashboard</title>
    <link rel="stylesheet" href="/css/ApplicantInfo.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>

<body>
    <div class="main-content">
        <h3>Applicant Details</h3>
        <table>
            <thead>
                <tr>
                    <th>Field</th>
                    <th>Value</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>First Name</td>
                    <td><p id="firstname"></p></td>
                </tr>
                <tr>
                    <td>Last Name</td>
                    <td><p id="lastname"></p></td>
                </tr>
                <tr>
                    <td>Email</td>
                    <td><p id="email"></p></td>
                </tr>
                <tr>
                    <td>Phone Number</td>
                    <td><p id="phone"></p></td>
                </tr>
                <tr>
                    <td>Username</td>
                    <td><p id="username"></p></td>
                </tr>
            </tbody>
        </table>
    </div>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
        const token = localStorage.getItem('token'); // assuming you stored it after login

        if (!token) {
            console.error("No token found in localStorage. Redirecting to login.");
            window.location.href = '/html/Login.html';
            return;
        }

        // ✅ Secure profile fetch
        fetch('http://localhost:8080/v1/questify/profile', {
            method: 'GET',
            headers: {
                'Authorization': `Bearer ${token}`,
                'Content-Type': 'application/json'
            }
        })
        .then(response => response.json())
        .then(data => {
                    if (data.username) {
                        console.log(data.firstName, data.lastName, data.email, data.mobile);
                        document.getElementById('username').textContent = data.username;
                        document.getElementById('firstname').textContent = data.firstName;
                        document.getElementById('lastname').textContent = data.lastName;
                        document.getElementById('email').textContent = data.email;
                        document.getElementById('phone').textContent = data.mobile;
                    } else {
                        console.error('Failed to fetch username');
                    }
                })
                .catch(error => console.error('Error fetching profile:', error));
            //end
            // Handle Forgot Password Form Submission
            async function first(){
                event.preventDefault();
                const email = document.getElementById('username').textContent;

                try {
                    const response = await fetch("/forgot-password", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ email }),
                    });

                    const result = await response.json();
                    document.getElementById("forgot-message").textContent = result.message;

                    if (response.ok) {
                        forgotPopup.style.display = "none";
                        resetPopup.style.display = "flex";
                    }
                } catch (error) {
                    document.getElementById("forgot-message").textContent = `Error: ${error.message}`;
                }
            };
        });
    </script>
</body>
</html>
